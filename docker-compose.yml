services:
  nahida-tts:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PYTORCH_IMAGE: ${PYTORCH_IMAGE:-docker.m.daocloud.io/pytorch/pytorch:2.7.1-cuda11.8-cudnn9-runtime}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    image: nahida-sparktts:latest
    container_name: nahida-sparktts
    ports:
      - "7861:7861"
    volumes:
      - ./genshin:/models:ro
      - ./outputs:/app/outputs
    environment:
      MODEL_PATH: /models
      GRADIO_SERVER_NAME: 0.0.0.0
      GRADIO_SERVER_PORT: 7861
      GRADIO_INBROWSER: 0
      PYTHONIOENCODING: utf-8
    gpus: all
    shm_size: "8gb"
    restart: unless-stopped
