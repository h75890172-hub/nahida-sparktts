services:
  nahida-tts-cpu:
    build:
      context: .
      dockerfile: Dockerfile
    image: nahida-sparktts:latest
    container_name: nahida-sparktts-cpu
    ports:
      - "7862:7861"
    volumes:
      - ./genshin:/models:ro
      - ./outputs:/app/outputs
    environment:
      MODEL_PATH: /models
      GRADIO_SERVER_NAME: 0.0.0.0
      GRADIO_SERVER_PORT: 7861
      GRADIO_INBROWSER: 0
      CUDA_VISIBLE_DEVICES: ""
      PYTHONIOENCODING: utf-8
    shm_size: "8gb"
    restart: unless-stopped
