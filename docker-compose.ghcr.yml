services:
  nahida-tts:
    image: ghcr.io/project-maintainer/nahida-sparktts:main
    container_name: nahida-sparktts
    ports:
      - "7861:7861"
    volumes:
      - ./genshin:/models:ro
      - ./outputs:/app/outputs
    environment:
      MODEL_PATH: /models
      GRADIO_SERVER_NAME: 0.0.0.0
      GRADIO_SERVER_PORT: 7861
      GRADIO_INBROWSER: 0
      PYTHONIOENCODING: utf-8
    gpus: all
    shm_size: "8gb"
    restart: unless-stopped
